[project]
name = "qdrant-mcp"
version = "0.1.0"
description = "MCP server for Qdrant with pluggable embedding providers"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=4.1.4",
    "openai>=3.39.0",
    "pydantic-settings>=2.16.1",
    "qdrant-client>=1.20.0",
]

[project.scripts]
qdrant-mcp = "qdrant_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
